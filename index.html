/* ---------------- direct manipulation (mouse) ----------------
   The keyboard is the instrument; the mouse is the hand. Everything here obeys
   the same physics as driving — a drag cannot teleport the car through a bumper,
   it walks it along the exact arc its wheel is on, collision-checked, recorded
   in the same history. Nothing here is a shortcut past the manoeuvre.

   grab the BODY  → walk along the arc your wheel is on
   grab the NOSE  → point the front wheels (dry steer, car held)
   click the car  → toggle the armed gear R / D
   right-click    → the four wheel commands, on the spot
   drag a parked car → resize the slot; the band greys out and re-solves on release
   wheel over the road → scrub your run, ⇧ = ×5
   No zoom, no pan: the view always frames the whole manoeuvre, and a learner who
   can pan is a learner who can lose the kerb off-screen. */
function S2W(px,py){
  var k=VIEW.k;
  if(S.rot) return [VIEW.cx-(py-VIEW.h/2)/k, VIEW.cy-(px-VIEW.w/2)/k];
  return [VIEW.cx+(px-VIEW.w/2)/k, VIEW.cy-(py-VIEW.h/2)/k];
}
function inPoly(p,poly){
  var c=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    var a=poly[i],b=poly[j];
    if((a[1]>p[1])!==(b[1]>p[1]) && p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]) c=!c;
  }
  return c;
}
function hitTest(w){
  var C=corners(S.pose[0],S.pose[1],S.pose[2]);
  if(inPoly(w,C)){
    var dx=w[0]-S.pose[0],dy=w[1]-S.pose[1],co=Math.cos(S.pose[2]),si=Math.sin(S.pose[2]);
    var a=dx*co+dy*si;
    return {t:a>CAR.p*0.55?'nose':'body'};
  }
  var OB=obstacles(S.slot);
  if(inPoly(w,OB[0])) return {t:'parked',i:0};
  if(inPoly(w,OB[1])) return {t:'parked',i:1};
  return {t:'road'};
}
var MOUSE={on:null,drag:null,hot:null};
(function(){
  var st=$('#stage'), down=null;

  function wpt(e){
    var r=cv.getBoundingClientRect();
    return S2W(e.clientX-r.left,e.clientY-r.top);
  }
  /* Signed travel from the drag anchor along the fixed circle the wheel defines.
     Constant δ ⇒ the ICR is fixed in the world, so this is one atan2, not a search. */
  function arcParam(w,A){
    if(A.straight){
      return (w[0]-A.p0[0])*Math.cos(A.th0)+(w[1]-A.p0[1])*Math.sin(A.th0);
    }
    var a=Math.atan2(w[1]-A.c[1],w[0]-A.c[0]);
    var d=a-A.a0; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    return d*A.R*A.sgn;
  }
  function anchor(){
    var p0=[S.pose[0],S.pose[1]],th0=S.pose[2];
    if(Math.abs(S.delta)<1e-3) return {straight:true,p0:p0,th0:th0};
    var R=CAR.p/Math.tan(Math.abs(S.delta)), sgn=S.delta>0?1:-1;
    var c=[p0[0]-sgn*R*Math.sin(th0), p0[1]+sgn*R*Math.cos(th0)];
    return {straight:false,c:c,R:R,sgn:sgn,a0:Math.atan2(p0[1]-c[1],p0[0]-c[0]),p0:p0,th0:th0};
  }
  function walkTo(u){
    var moved=0,guard=0;
    while(Math.abs(u-moved)>0.004&&guard++<400){
      var step=Math.sign(u-moved)*Math.min(0.03,Math.abs(u-moved));
      if(!tryStep(step)) break;
      moved+=step;
    }
    return moved;
  }
  function setCursor(h){
    st.style.cursor = h==='body'?(down?'grabbing':'grab') :
      h==='nose'?'crosshair' : h==='parked'?(S.rot?'row-resize':'col-resize') : 'default';
  }

  st.addEventListener('pointerdown',function(e){
    if(e.pointerType==='touch') return;
    closeCtx();
    if(e.button===2) return;                      // handled by contextmenu
    var w=wpt(e), h=hitTest(w);
    if(h.t==='road') return;
    e.preventDefault(); st.setPointerCapture(e.pointerId);
    TIP.mute=true; if(TIP.hard) TIP.hard();
    if(h.t==='parked'){
      down={k:'parked',i:h.i,x0:w[0],g0:S.gapExtra,moved:false};
      S.dragBand=true;
    }else if(h.t==='nose'){
      down={k:'steer',moved:false}; steerTo(w);
    }else{
      down={k:'walk',A:anchor(),u:0,moved:false};
      if(S.done){S.done=false;$('#verdict').style.opacity=0;}
    }
    MOUSE.drag=down.k; setCursor(h.t);
  });
  function steerTo(w){
    var a=Math.atan2(w[1]-S.pose[1],w[0]-S.pose[0])-S.pose[2];
    while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI;
    if(Math.abs(a)>Math.PI/2) a=a>0?Math.PI-a:-Math.PI-a;   // grabbing past the axle still means "point it that way"
    S.steerCmd=clamp(a/CAR.dmax,-1,1); S.snap=true;
  }
  st.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch') return;
    var w=wpt(e);
    if(!down){ var h=hitTest(w); MOUSE.hot=h.t; setCursor(h.t); return; }
    down.moved=true;
    if(down.k==='walk'){
      var u=arcParam(w,down.A);
      if(Math.abs(u-down.u)>0.004) down.u+=walkTo(u-down.u);
    }else if(down.k==='steer'){
      steerTo(w);
    }else if(down.k==='parked'){
      var d=w[0]-down.x0, g=down.i===1?down.g0+d:down.g0-d;
      S.gapExtra=clamp(+g.toFixed(3),0.55,3.20);
      S.slot=slotLen();
    }
  });
  function end(e){
    if(!down) return;
    var d=down; down=null; MOUSE.drag=null; S.dragBand=false;
    try{st.releasePointerCapture(e.pointerId);}catch(_){}
    if(d.k==='parked'){
      S.gapExtra=+S.gapExtra.toFixed(2); LS.set('gapExtra',S.gapExtra);
      reset();                                   // re-solve band, θ*, start pose
    }
    if(d.k==='walk'&&!d.moved){                    // a click, not a drag
      S.gear=-S.gear; paintRail();
    }
    setCursor(MOUSE.hot);
  }
  st.addEventListener('pointerup',end);
  st.addEventListener('pointercancel',end);
  st.addEventListener('pointerleave',function(e){ if(!down){st.style.cursor='default';} });

  /* wheel = scrub, the editor idiom — but only over the car itself (or with ⇧
     anywhere over the road). A trackpad user scrolling down to the notes must not
     have the page hijacked because the pointer happened to be over the tarmac. */
  function wheelScrub(e,always){
    if(!always){ var t=hitTest(wpt(e)).t; if(t!=='body'&&t!=='nose'&&!e.shiftKey) return; }
    e.preventDefault();
    scrub((e.deltaY>0?1:-1)*(e.shiftKey?25:3));
  }
  st.addEventListener('wheel',function(e){wheelScrub(e,false);},{passive:false});
  $('#tlbar').addEventListener('wheel',function(e){wheelScrub(e,true);},{passive:false});

  /* ---- right-click: the wheel commands, where the wheel is ---- */
  var ctx=document.createElement('div'); ctx.id='ctx'; document.body.appendChild(ctx);
  function closeCtx(){ ctx.classList.remove('on'); }
  MOUSE.closeCtx=closeCtx;
  st.addEventListener('contextmenu',function(e){
    e.preventDefault();
    var w=wpt(e), h=hitTest(w);
    var items = h.t==='parked' ? [
      ['GAP −5 cm',function(){nudge('gap',-1);}],
      ['GAP +5 cm',function(){nudge('gap',1);}],
      ['SET TO ONE-MOVE MINIMUM',function(){S.gapExtra=+(S.minSlot-CAR.L).toFixed(2);LS.set('gapExtra',S.gapExtra);reset();}]
    ] : h.t==='road' ? [
      ['RESET',function(){reset();}],
      ['REWIND TO LAST FLIP',function(){rewindFlip();}],
      ['BEST LINE FROM HERE',function(){setHint(!S.showHint);}]
    ] : [
      ['FULL LOCK TOWARD KERB',function(){S.steerCmd=-1;S.snap=true;}],
      ['FULL LOCK AWAY',function(){S.steerCmd=1;S.snap=true;}],
      ['WHEEL STRAIGHT',function(){S.steerCmd=0;S.snap=true;}],
      ['FLIP TO UNWIND NOW',function(){S.steerCmd=S.delta<0?1:-1;S.snap=true;}],
      ['ARM '+(S.gear<0?'D':'R'),function(){S.gear=-S.gear;paintRail();}],
      ['REWIND TO LAST FLIP',function(){rewindFlip();}]
    ];
    ctx.innerHTML=items.map(function(it,i){return '<button data-i="'+i+'">'+it[0]+'</button>';}).join('');
    ctx.classList.add('on');
    ctx.style.left=Math.min(e.clientX,window.innerWidth-ctx.offsetWidth-8)+'px';
    ctx.style.top=Math.min(e.clientY,window.innerHeight-ctx.offsetHeight-8)+'px';
    ctx.onclick=function(ev){
      var b=ev.target.closest('button'); if(!b) return;
      items[+b.dataset.i][1](); closeCtx();
    };
  });
  window.addEventListener('pointerdown',function(e){
    if(!ctx.contains(e.target)) closeCtx();
  },true);
  window.addEventListener('keydown',closeCtx,true);
})();

/* ---------------- controls ---------------- */
function setMode(m){
  S.mode=m;
  [].forEach.call(document.querySelectorAll('#modeSeg button'),function(b){
    b.setAttribute('aria-pressed',b.dataset.mode===m);});
  if(m!=='drive'){ if(!S.ai||S.aiPolicyOf!==S.pol) buildAI(); if(m==='watch'||m==='predict'){S.aiDist=0;S.aiPlay=true;$('#btnPlay').innerHTML=ico('pause')+' AI';} }
  else {S.aiPlay=false;$('#btnPlay').innerHTML=ico('play')+' AI';}
}
function setPol(p){
  S.pol=p;LS.set('pol',p);
  [].forEach.call(document.querySelectorAll('#polSeg button'),function(b){
    b.setAttribute('aria-pressed',b.dataset.pol===p);});
  buildAI();
  if(S.mode==='drive') setMode('compare');
  if(S.mode==='watch'||S.mode==='predict'){S.aiDist=0;S.aiPlay=true;$('#btnPlay').innerHTML=ico('pause')+' AI';}
}
function togglePlay(){
  if(S.mode==='drive') setMode('watch');
  if(!S.ai) buildAI();
  if(S.aiDist>=totalDist(S.ai.tr)-1e-6) S.aiDist=0;
  S.aiPlay=!S.aiPlay;
  $('#btnPlay').innerHTML=(S.aiPlay?ico('pause'):ico('play'))+' AI';
}
function setRot(v){S.rot=v;LS.set('rot',v);$('#btnRot').setAttribute('aria-pressed',v);}
function setEnv(v){S.env=v;LS.set('env',v);$('#btnEnv').setAttribute('aria-pressed',v);}
function setBand(v){S.band=v;LS.set('band',v);$('#btnBand').setAttribute('aria-pressed',v);}
function setPrev(v){S.showPreview=v;LS.set('preview',v);$('#btnPrev').setAttribute('aria-pressed',v);PV.key='';}
function setHint(v){S.showHint=v;LS.set('hint',v);$('#btnHint').setAttribute('aria-pressed',v);HINT.key='';if(!v)S.hint=null;}
$('#btnRot').onclick=function(){setRot(!S.rot);};
$('#btnEnv').onclick=function(){setEnv(!S.env);};
$('#btnBand').onclick=function(){setBand(!S.band);};
$('#btnPrev').onclick=function(){setPrev(!S.showPreview);};
$('#btnHint').onclick=function(){setHint(!S.showHint);};
$('#btnReset').onclick=function(){reset();};
$('#btnPlay').onclick=togglePlay;
$('#btnHelp').onclick=openHelp;
/* On a phone the closed accordions cost ~200 px of the only thing that matters.
   Same nodes, moved into the sheet — never duplicated, so state is shared. */
$('#btnNotes').onclick=function(){
  var m=$('#mbox'); m.innerHTML='<h3>NOTES</h3>';
  m.appendChild($('#more'));
  $('#more').style.display='block'; $('#more').style.maxHeight='none';
  $('#modal').classList.add('on');
};
$('#modal').addEventListener('click',function(e){
  if(e.target!==this) return;
  var mo=$('#more'); if(mo&&mo.parentNode===$('#mbox')){mo.style.display='';mo.style.maxHeight='';document.body.appendChild(mo);}
});
[].forEach.call(document.querySelectorAll('#modeSeg button'),function(b){b.onclick=function(){setMode(b.dataset.mode);};});
[].forEach.call(document.querySelectorAll('#polSeg button'),function(b){b.onclick=function(){setPol(b.dataset.pol);};});
$('#sGap').oninput=function(){S.gapExtra=+this.value;LS.set('gapExtra',S.gapExtra);reset();};
$('#sOut').oninput=function(){S.out=+this.value;LS.set('out',S.out);reset();};
$('#sAng').oninput=function(){S.thUser=true;S.thStar=+this.value;LS.set('thStar',S.thStar);reset();};
$('#selCar').innerHTML=PRESETS.map(function(p,i){return '<option value="'+i+'">'+p.n+'</option>';}).join('');
$('#selCar').value=S.carIdx;
$('#selCar').onchange=function(){S.carIdx=+this.value;LS.set('car',S.carIdx);reset();};
function syncKnobs(){
  $('#sGap').value=S.gapExtra;$('#sOut').value=S.out;$('#sAng').value=S.thStar;
  var over=S.slot-S.minSlot, g=$('#vGap');
  g.textContent=S.slot.toFixed(2)+'m';
  g.style.color=over>=0?'#4ade80':(over>-0.55?'#fbbf24':'#f87171');
  g.title='one-move minimum for this car: '+S.minSlot.toFixed(2)+' m';
  $('#subMin').textContent=over>=0
    ? '+'+over.toFixed(2)+' m over the one-move minimum'
    : (Math.abs(over)*100).toFixed(0)+' cm UNDER the one-move minimum — no single manoeuvre fits; you must work it in';
  $('#subMin').style.color=over>=0?'var(--dim)':'#fbbf24';
  $('#vOut').textContent=(S.out*100).toFixed(0)+'cm';
  $('#vAng').textContent=S.thStar+'°'+(S.bandLo?' ('+S.bandLo+'–'+S.bandHi+')':' (—)');
  var oob=S.bandLo&&(S.thStar<S.bandLo||S.thStar>S.bandHi);
  $('#vAng').style.color=oob?'#f87171':'#e8edf4';
  $('#vAng').style.cursor=oob?'pointer':'';
  $('#vAng').title=oob?'outside the feasible band — click to snap to its centre':'';
  $('#vAng').onclick=oob?function(){S.thUser=false;S.thStar=null;LS.set('thStar',null);
    localStorage.removeItem('kl3.thStar');reset();}:null;
}

/* ---------------- modal ---------------- */
function openModal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function openHelp(){
  var h='';
  KEYMAP.forEach(function(r){
    if(r.s){h+='<div class="kh">'+r.s+'</div>';return;}
    h+='<span class="kk">'+(r.g||esc(r.d))+(r.alt?'  <i>'+r.alt+'</i>':'')+'</span><span class="kd">'+r.lab+' — '+
        String(r.tip).replace(/<\/?b>/g,'')+'</span>';
  });
  var mouse=[
    ['grab the body','walk the car along the exact arc its wheel is on — collision-checked, recorded'],
    ['grab the nose','point the front wheels. The car is held while they swing, like a real dry steer'],
    ['click the car','flip the armed gear R / D — the badge on the roof'],
    ['right-click','the wheel commands where the wheel is; on a parked car, the slot; on the road, the run'],
    ['drag a parked car','resize the slot live. The band greys out while you drag and re-solves when you let go'],
    ['wheel over the car','scrub your run — or ⇧+wheel anywhere, or wheel over the timeline. ⇧ = ×5']
  ];
  openModal('<h3>EVERY KEY</h3><div class="kg">'+h+
    '<div class="kh">MOUSE</div>'+mouse.map(function(m){
      return '<span class="kk">'+m[0]+'</span><span class="kd">'+m[1]+'</span>';}).join('')+
    '</div>'+
    '<p class="note">Arrows drive; WASD does the same if your hand lives there. '+
    'SPACE drives in the armed gear — the R/D badge on the car tells you which. '+
    'No zoom, no pan: the view always frames the whole manoeuvre.</p>');
}
/* ---------------- accordions ---------------- */
$('#more').innerHTML=[
 ['THE ONLY EQUATION YOU NEED', `
  <p>Reversing on full lock, your rear axle traces a circle of radius <code>R = p / tan δmax</code>.
  Everything below falls out of that one fact.</p>
  <h4>THE MASTER EQUATION</h4>
  <p>To move sideways by <code>d</code> using a turn to angle θ, a straight run of <code>s</code>, and a full unwind:</p>
  <p><code>d = 2R(1 − cos θ) + s · sin θ</code></p>
  <ul>
    <li><b>2R(1 − cos θ)</b> — what the two arcs give you. Both halves, in and out.</li>
    <li><b>s · sin θ</b> — what straight reversing gives you. <b>This is the cheap half.</b></li>
  </ul>
  <h4>WHY THE HUD SHOWS "RESERVE"</h4>
  <p>Once you are at angle θ, unwinding to parallel will give you back exactly
  <code>U = R(1 − cos θ)</code> of lateral movement — no more, no less. Your outstanding lateral
  debt is <code>debt = y − 30 cm</code>. The gauge shows <code>debt − U</code>.</p>
  <p><b>Flip to unwind when RESERVE reads zero.</b> Positive and you will finish short of the kerb.
  Negative and the unwind drives you into it. This single number replaces every "look for the 45°"
  rule of thumb, and it is correct for every car, every gap, and every starting position.</p>
  <p class="note">The reason so many people stall at roughly 45° is that they are steering to a
  <i>remembered angle</i> instead of to a <i>condition</i>. The angle is an output, not a target.</p>`],

 ['WHY "FLIP WHEN THE GAP HALVES" FAILS', `
  <p>The folk rule — reverse on full lock, then flip lock-to-lock when your kerb-side gap has closed
  to half — is exact for the <b>rear axle centre</b>. You cannot see the rear axle centre.</p>
  <p>What you can see is the nearest visible point of your own flank, and that point drops toward the
  kerb through <i>rotation</i> as well as translation. So it reaches "half" early, you flip early, and
  you finish parallel but short. Run policy <b>5 — THE MYTH</b> and watch it land:</p>
  <table><tr><th>car</th><th>finishes</th></tr>
  <tr><td>supermini</td><td>47 cm out</td></tr>
  <tr><td>hatch</td><td>59 cm out</td></tr>
  <tr><td>saloon</td><td>80 cm out</td></tr>
  <tr><td>large SUV</td><td>84 cm out</td></tr>
  <tr><td>LWB van</td><td>95 cm out</td></tr></table>
  <p>Dead parallel every time, and wrong by more the bigger your car. It <i>feels</i> like a rule that
  works, because parallel feels like success. That is exactly why it survives.</p>`],

 ['WHEN THE GAP IS TOO SMALL: THE SHUFFLE', `
  <p>Once you are parallel and merely too far out, you can still move sideways. Four arcs —
  lock away, back; lock toward, back; lock away, forward; lock toward, forward — return you to the
  same heading and the same longitudinal position, displaced toward the kerb by</p>
  <p><code>2(2R − √(4R² − L²)) ≈ L² / 2R</code> per cycle, for an excursion of <code>L</code>.</p>
  <p>It is <b>quadratic in L</b>: doubling the room you use quadruples the yield. Using 1.0 m instead
  of 0.5 m is not twice as good, it is four times as good. Conversely, in a truly tight bracket the
  shuffle is close to useless — the cycle count goes as <code>N ≈ 2dR/L²</code>.</p>
  <h4>THE CEILING NOBODY MENTIONS</h4>
  <p>The forward half of each cycle steers <i>toward</i> the kerb, which swings your kerb-side front
  corner <code>(p + front overhang) · sin φ</code> closer to it. Long before you run out of
  longitudinal room, <b>your own nose limits the excursion</b>. That is why the shuffle collapses in
  effectiveness exactly when you need it most.</p>`],

 ['THE FIVE MACHINE POLICIES', `
  <p>Each is a different objective on the same physics. Watching them disagree is the point.</p>
  <ul>
    <li><b>1 · MAX-MARGIN</b> — maximises the smallest clearance reached at any instant.
    This is the policy worth copying. It usually takes a <i>lower</i> entry angle and a longer
    straight leg than the textbook.</li>
    <li><b>2 · MIN-MOVES</b> — fewest direction changes. It looks impressive and it is a
    <b>bad habit</b>: it buys its move count by running centimetres from other people's paint.</li>
    <li><b>3 · 45°</b> — the taught manoeuvre, executed exactly. Note that 45° is often not even
    feasible in the gap you have set; turn on <b>θ BAND</b> to see which angles actually work.</li>
    <li><b>4 · SHUFFLE</b> — no entry manoeuvre at all, pure lateral crawl. Shows you the cost.</li>
    <li><b>5 · THE MYTH</b> — the folk rule, executed literally. The comparator lesson.</li>
  </ul>
  <p class="note">MIN-MOVES is the headline number every parking demo shows off. It is a vanity
  metric. Margin is what keeps your bumpers, and margin is what this rig defaults to.</p>`],

 ['HOW TO USE THIS RIG', `
  <h4>THE LOOP THAT ACTUALLY BUILDS SKILL</h4>
  <ol>
    <li>Drive it yourself first, badly. Do not watch the machine first — watching produces
    <i>fluency</i>, which feels like learning and is not.</li>
    <li>Hit <b>G</b>. The machine now runs your start, ghosted over you, synced by distance
    travelled rather than by time. The dashed line between the two cars is your divergence, in
    centimetres, live.</li>
    <li>Find where the number spikes. That instant is your error. Scrub back to it with
    <b>J</b>, step frame by frame with <b>,</b> / <b>.</b>, or hit <b>⌫</b> to jump straight to the
    last direction change.</li>
    <li>Drive on from there. Your abandoned attempt stays on screen as a grey ghost so you can
    see what the fix bought you.</li>
    <li>Change <i>one</i> thing — gap, offset, car — and repeat. Varying the conditions between
    attempts feels worse and retains far better than drilling the same slot.</li>
  </ol>
  <h4>PREDICT MODE</h4>
  <p>Watching is passive and passive is worthless. PREDICT stops the machine at every wheel
  movement and makes you call it first. Being wrong here is the most valuable thing that
  happens in this app — a wrong prediction you then see corrected is worth several correct ones.</p>`],

 ['NUMBERS FOR YOUR CAR', `
  <div id="tblCar"></div>
  <p class="note">Turning circle is the manufacturer's kerb-to-kerb figure. R is derived from it, not
  guessed: <code>R = √((T/2)² − p²) − track/2</code>. If your car is not in the list, pick the closest
  and treat the one-move minimum as approximate.</p>`]
].map(function(s){return '<details><summary>'+s[0]+'</summary><div class="body">'+s[1]+'</div></details>';}).join('');

function fillCarTable(){
  var rows=PRESETS.map(function(P){
    var sv={L:CAR.L,W:CAR.W,p:CAR.p,rear:CAR.rear,T:CAR.T,track:CAR.track};
    CAR.L=P.L;CAR.W=P.W;CAR.p=P.p;CAR.rear=P.r;CAR.T=P.T;CAR.track=P.tr;recompute();
    var R=CAR.R,dm=D(CAR.dmax);
    var min=minSlot();
    CAR.L=sv.L;CAR.W=sv.W;CAR.p=sv.p;CAR.rear=sv.rear;CAR.T=sv.T;CAR.track=sv.track;recompute();
    return '<tr><td>'+P.n+'</td><td>'+P.L.toFixed(2)+'</td><td>'+R.toFixed(2)+'</td><td>'+
      dm.toFixed(0)+'°</td><td>'+min.toFixed(2)+'</td><td>+'+(min-P.L).toFixed(2)+'</td></tr>';
  }).join('');
  $('#tblCar').innerHTML='<table><tr><th>car</th><th>len</th><th>R</th><th>δmax</th>'+
    '<th>1-move min</th><th>surplus</th></tr>'+rows+'</table>'+
    '<p>The surplus is remarkably constant at <b>1.6–1.8 m</b> across everything from a supermini to a '+
    'long-wheelbase van. A big car does not need proportionally more room — it needs about the same '+
    'extra metre and three quarters.</p>';
}
var _msCache={};
/* Smallest slot this car can take in ONE manoeuvre, measured the way the rig
   actually stages it: each candidate angle gets ITS OWN canonical start pose at
   the current lateral offset. A fixed 45-degree start understates the car by ~10 cm,
   which showed up as a slot the gap readout called legal and the band called empty. */
function minSlot(){
  var key=[CAR.L,CAR.W,CAR.p,CAR.rear,CAR.R,S.out].join('|');   // keyed on geometry, not on the selector index
  if(_msCache[key]!==undefined) return _msCache[key];
  var lo=CAR.L+0.2,hi=CAR.L+4.0,R=CAR.R,d=PW+S.out;
  function startAt(t){
    var r=Rad(t), s=(d-2*R*(1-Math.cos(r)))/Math.sin(r); if(s<0)s=0;
    return [CAR.rear+0.30+2*R*Math.sin(r)+s*Math.cos(r), targetY()+d, 0];
  }
  function ok(sl){
    for(var i=16;i<=64;i++){
      var st=startAt(i), p=planCanonical(st,sl,i,true); if(!p) continue;
      if(scoreTraj(simulate(st,p.segs,sl),sl,targetY()).ok) return true;
    }
    return false;
  }
  if(!ok(hi)) return (_msCache[key]=hi);
  for(var i=0;i<14;i++){var m=(lo+hi)/2; if(ok(m))hi=m;else lo=m;}
  return (_msCache[key]=hi);
}

/* ---------------- boot ---------------- */
applyCar(); reset(); paintRail(); syncKnobs();
setPrev(S.showPreview); setHint(S.showHint); setRot(S.rot); setEnv(S.env); setBand(S.band);
// the per-preset minimum-slot table is a bisection over 7 cars — build it only when opened
(function(){
  var d=[].slice.call(document.querySelectorAll('#more details')).pop(), built=false;
  d.addEventListener('toggle',function(){ if(d.open&&!built){built=true;fillCarTable();} });
})();
window.addEventListener('resize',function(){fitView();});
stage.addEventListener('pointerdown',function(){stage.focus();});
stage.focus();
requestAnimationFrame(loop);
