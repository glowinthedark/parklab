<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>KERB LAB v3 — the rig</title>
<style>
:root{
  --bg:#0a0c10; --panel:#12161d; --panel2:#171d26; --line:#242c38;
  --ink:#e8edf4; --dim:#8d98a8; --dim2:#5f6b7c;
  --acc:#4ade80; --acc2:#22d3ee; --warn:#fbbf24; --bad:#f87171; --ghost:#a78bfa;
  --r:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- top strip ---------- */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;flex-wrap:wrap}
#brand{font-weight:700;letter-spacing:.14em;font-size:11px;color:var(--dim)}
#brand b{color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:4px 9px;font-size:11px;color:var(--dim);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--acc);color:#04120a;font-weight:700}
.pill{padding:4px 9px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--dim)}
.pill[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
#spacer{flex:1}

/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;min-height:0;background:#070a0e;
  outline:none;touch-action:none}
#stage:focus-visible::after,#stage.kb::after{content:"";position:absolute;inset:2px;
  border:2px solid var(--acc2);border-radius:6px;pointer-events:none;opacity:.65}
#cv{display:block;width:100%;height:100%}

/* live readout, always on screen */
#hud{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:3px;
  font-family:var(--mono);font-size:11px;pointer-events:none;text-shadow:0 1px 3px #000}
#hud div{display:flex;gap:6px;pointer-events:auto;cursor:help;width:max-content}
#hud i{font-style:normal;color:var(--dim2);width:52px;display:inline-block}
#hud b{font-weight:700}
#phase{position:absolute;left:50%;top:8px;transform:translateX(-50%);
  font-weight:800;letter-spacing:.16em;font-size:13px;color:var(--acc);
  pointer-events:auto;cursor:help;text-shadow:0 1px 4px #000;text-align:center;white-space:nowrap}
#cue{position:absolute;left:50%;top:28px;transform:translateX(-50%);max-width:min(92%,560px);
  text-align:center;font-size:12px;color:var(--ink);opacity:.9;pointer-events:none;
  text-shadow:0 1px 4px #000}
#verdict{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-weight:800;font-size:clamp(18px,5vw,30px);letter-spacing:.06em;text-align:center;
  pointer-events:none;opacity:0;transition:opacity .18s;text-shadow:0 2px 12px #000}
#verdict small{display:block;font-size:13px;font-weight:500;letter-spacing:0;opacity:.85;margin-top:4px}

/* touch steer zones */
.tz{position:absolute;top:0;bottom:44px;width:22%;display:none;
  align-items:center;justify-content:center;user-select:none}
.tz span{font-family:var(--mono);font-size:11px;color:var(--dim2);
  writing-mode:vertical-rl;letter-spacing:.2em}
#tzL{left:0}#tzR{right:0}
.tz.on{background:linear-gradient(90deg,rgba(74,222,128,.16),transparent)}
#tzR.on{background:linear-gradient(270deg,rgba(74,222,128,.16),transparent)}

/* keyboard rail */
#rail{position:absolute;right:8px;top:8px;bottom:8px;display:flex;flex-direction:column;gap:2px;
  max-height:calc(100% - 16px);overflow-y:auto;scrollbar-width:none;
  font-family:var(--mono);font-size:10.5px;color:var(--dim);pointer-events:none;
  text-align:right;text-shadow:0 1px 3px #000}
#rail k{display:inline-block;min-width:15px;padding:0 3px;margin-left:5px;
  border:1px solid var(--line);border-radius:3px;background:#0e1218;color:var(--ink)}
#rail k.hot{background:var(--acc);color:#04120a;border-color:var(--acc)}
#rail k.alt{opacity:.45;margin-left:2px}
#rail::-webkit-scrollbar{display:none}
#rail .hd{color:var(--dim2);margin-top:5px;letter-spacing:.12em}
#rail>div{pointer-events:auto;cursor:help}
#rail>div.hd{pointer-events:none;cursor:default}

/* ---------- timeline ---------- */
#tl{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;
  border-top:1px solid var(--line);background:var(--panel)}
#tlbar{position:relative;flex:1;height:22px;border-radius:5px;background:#0b0f15;
  border:1px solid var(--line);overflow:hidden;cursor:pointer;touch-action:none}
#tlfill{position:absolute;left:0;top:0;bottom:0;background:rgba(74,222,128,.18)}
#tlghost{position:absolute;top:0;bottom:0;background:rgba(167,139,250,.14)}
#tlhead{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--acc)}
#tlmarks{position:absolute;inset:0;pointer-events:none}
#tlmarks i{position:absolute;top:0;bottom:0;width:1px;background:var(--dim2);opacity:.55}
#tlmarks i.d{background:var(--warn);opacity:.9}
#tllab{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:88px;text-align:right}

/* ---------- dock ---------- */
#dock{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:7px 10px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.knob{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 7px}
.knob input[type=range]{width:104px;accent-color:var(--acc);height:18px}
.knob b{font-family:var(--mono);color:var(--ink);min-width:46px;text-align:right}
.btn{padding:5px 11px;border:1px solid var(--line);border-radius:8px;font-size:12px;
  background:var(--panel2);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--acc);color:#04120a;font-weight:700;border-color:var(--acc)}
.btn.g{background:transparent;color:var(--dim)}
.btn k{font-family:var(--mono);font-size:10px;opacity:.6;margin-left:5px}
#drive{display:none;gap:7px}
#drive .big{flex:1;padding:13px 0;text-align:center;font-weight:700;font-size:13px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
#drive .big.on{background:var(--acc);color:#04120a}

/* ---------- accordions ---------- */
#more{flex:0 0 auto;max-height:44vh;overflow-y:auto;background:var(--bg);
  border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
details{border-bottom:1px solid var(--line)}
summary{padding:9px 12px;font-size:12px;color:var(--dim);cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--dim2);font-size:10px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
details[open] summary{color:var(--ink)}
.body{padding:0 12px 12px;font-size:13px;color:#c3ccd8;max-width:74ch}
.body p{margin:0 0 9px}
.body h4{margin:12px 0 5px;font-size:12px;letter-spacing:.1em;color:var(--acc);font-weight:700}
.body code,.k{font-family:var(--mono);font-size:12px;background:#0d1116;border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;color:var(--acc2)}
.body ul{margin:0 0 9px;padding-left:18px}
.body li{margin:0 0 4px}
table{border-collapse:collapse;font-size:12px;width:100%;margin:0 0 10px;font-family:var(--mono)}
th,td{border:1px solid var(--line);padding:4px 7px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600;background:var(--panel2)}
.note{border-left:2px solid var(--warn);padding:5px 0 5px 10px;color:#d8c9a3;margin:0 0 10px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(4,6,10,.86);display:none;
  align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
#mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px;max-width:640px;width:100%;max-height:86vh;overflow:auto}
#mbox h3{margin:0 0 10px;font-size:13px;letter-spacing:.12em;color:var(--acc)}
.kg{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;align-items:center}
.kg span:nth-child(odd){font-family:var(--mono);color:var(--acc2);white-space:nowrap}
.kg span:nth-child(even){color:var(--dim)}
.kg .kh{grid-column:1/-1;font-family:var(--mono);font-size:10.5px;color:var(--dim2);
  letter-spacing:.14em;margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:3px}
.kg span i{font-style:normal;opacity:.45}
.kg span.kk{font-family:var(--mono);color:var(--acc2);white-space:nowrap}
.kg span.kd{color:var(--dim)}
#predict{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

#btnNotes{display:none}
@media (max-width:820px){
  #rail{display:none}
  #more{display:none}
  #btnNotes{display:inline-block}
  .tz{display:flex}
  #drive{display:flex}
  #more{max-height:38vh}
  .knob input[type=range]{width:82px}
}
@media (max-width:430px){
  #brand{display:none}
  .knob{font-size:10px;padding:2px 6px}
  #hud{font-size:10px}
}
.i{width:1em;height:1em;display:inline-block;vertical-align:-0.13em;flex:0 0 auto}
#rail k .i,.kg .i{width:1.05em;height:1.05em;vertical-align:-0.17em}
.big .i{width:1.15em;height:1.15em;vertical-align:-0.18em}

/* ---------- tooltips ---------- */
#tip{position:fixed;z-index:80;max-width:300px;padding:8px 10px;border-radius:8px;
  background:rgba(13,18,24,.97);border:1px solid #2a3542;color:#c7d0dc;
  font-size:11.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.6);
  pointer-events:none;opacity:0;transform:translateY(3px);
  transition:opacity .11s ease,transform .11s ease}
#tip.on{opacity:1;transform:none}
#tip b{color:var(--acc);font-weight:600}
#tip i{color:var(--ink);font-style:italic}
#tip .m{display:block;margin-top:5px;font-family:var(--mono);font-size:10.5px;
  color:var(--acc2);white-space:pre-wrap}
@media (hover:none){#tip{display:none}}
/* ---------- context menu ---------- */
#ctx{position:fixed;z-index:90;display:none;flex-direction:column;min-width:190px;padding:4px;
  background:rgba(13,18,24,.98);border:1px solid #2a3542;border-radius:8px;
  box-shadow:0 14px 36px rgba(0,0,0,.65)}
#ctx.on{display:flex}
#ctx button{all:unset;padding:7px 10px;border-radius:5px;font-size:11px;letter-spacing:.06em;
  color:var(--ink);cursor:pointer;white-space:nowrap}
#ctx button:hover{background:#1b2531;color:var(--acc)}
#stage{touch-action:none}
</style></head>

</svg>

<div id="top">
  <div id="brand">KERB <b>LAB</b> v3</div>
  <div class="seg" id="modeSeg">
    <button data-mode="drive" aria-pressed="true" data-tip="You drive. Nothing is shown that you have not earned — the machine line is hidden here on purpose.">DRIVE</button>
    <button data-mode="compare" aria-pressed="false" data-tip="Your run with the machine ghosted over it, synced by <b>metres driven</b>, not by clock. The dashed link shows how far apart you are at the same point in the manoeuvre.">COMPARE</button>
    <button data-mode="predict" aria-pressed="false" data-tip="The machine drives and stops at every wheel decision to ask what you would do. Being wrong here is worth more than watching ten perfect parks.">PREDICT</button>
    <button data-mode="watch" aria-pressed="false" data-tip="Pure demonstration. Deliberately the weakest mode: watching a clean park feels like learning and mostly is not.">WATCH</button>
  </div>
  <div class="seg" id="polSeg">
    <button data-pol="margin" aria-pressed="true" data-tip="Picks the line with the most metal-to-metal clearance. The one to copy when the slot is tight and your nerve is not.">MAX-MARGIN</button>
    <button data-pol="minmoves" aria-pressed="false" data-tip="Fewest direction changes, clearance be damned. Fast, and unforgiving of a sloppy start.">MIN-MOVES</button>
    <button data-pol="textbook" aria-pressed="false" data-tip="The driving-school 45°. Correct often enough to be taught, wrong often enough to strand people — press <b>B</b> and see where 45° actually sits in the band.">45°</button>
    <button data-pol="shuffle" aria-pressed="false" data-tip="Pure lock-to-lock shuffling from parallel. Gains roughly L²/2R per cycle — the tool for a slot below the one-move minimum.">SHUFFLE</button>
    <button data-pol="myth" aria-pressed="false" data-tip="&quot;Reverse until your wing mirror lines up, then straighten.&quot; Watch where it finishes. That is the folklore, run honestly.">THE MYTH</button>
  </div>
  <div id="spacer"></div>
  <button class="pill" id="btnPrev" aria-pressed="true" data-tip="Dashed ghost of where a full unwind from this instant lands you. An aid to be faded: switch it off once you can call the flip yourself.">FLIP</button>
  <button class="pill" id="btnHint" aria-pressed="true" data-tip="Re-solves the optimal remaining line from your current pose whenever you stop. Not from the start — from the mess you are actually in.">LINE</button>
  <button class="pill" id="btnEnv" aria-pressed="false" data-tip="Every square metre your body passes through. This is the area that must be empty, not the parking space.">ENV</button>
  <button class="pill" id="btnBand" aria-pressed="false" data-tip="Draws every approach angle that parks from this start pose. Its width is the whole argument against memorising one magic number.">θ</button>
  <button class="pill" id="btnRot" aria-pressed="false" data-tip="Portrait road — kerb on the left, traffic running up the screen. Matches how the manoeuvre looks over your shoulder. Remembered between sessions."><svg class="i"><use href="#i-rot"/></svg></button>
  <button class="pill" id="btnNotes" data-tip="The written notes: the equation, the failure modes, the numbers for your car.">NOTES</button>
  <button class="pill" id="btnHelp" data-tip="Every key, one sheet. Also on <b>?</b>."><svg class="i"><use href="#i-help"/></svg></button>
</div>

<div id="stage" tabindex="0">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <div id="phase" data-tip="Which part of the manoeuvre the rig thinks you are in, read from your gear and your steering — not from a script."></div>
  <div id="cue"></div>
  <div id="verdict"></div>
  <div class="tz" id="tzL"><span>LOCK LEFT</span></div>
  <div class="tz" id="tzR"><span>LOCK KERB</span></div>
  <div id="rail"></div>
</div>

<div id="tl">
  <button class="btn g" id="btnRew" data-tip="Jump back to your last direction change and carry on from there. Re-running one decision beats re-running the whole park."><svg class="i"><use href="#i-rew"/></svg><k>⌫</k></button>
  <div id="tlbar" data-tip="Your run, scrubbable by distance travelled. Drag it, or shuttle with <b>J</b>/<b>L</b> and step frames with <b>,</b>/<b>.</b> Ticks mark direction changes; red ticks mark contacts."><div id="tlfill"></div><div id="tlghost"></div><div id="tlmarks"></div><div id="tlhead"></div></div>
  <div id="tllab">0.00 m</div>
</div>

<div id="dock">
  <div class="row">
    <label class="knob" data-tip="Slot length. Drag it below the one-move minimum and the θ band vanishes — the slot is still parkable, just not in one line.">GAP<input type="range" id="sGap" min="0.55" max="3.20" step="0.05"><b id="vGap"></b></label>
    <label class="knob" data-tip="How far your flank sits from theirs at the start. Too close and your nose swings into them; too far and no angle in the band reaches the kerb.">OUT<input type="range" id="sOut" min="0.50" max="1.60" step="0.05"><b id="vOut"></b></label>
    <label class="knob" data-tip="The angle you are aiming for. It sets the start pose and the cue line only — the physics does not reward you for hitting it. Click the number when it reads OUT to re-centre it in the band.">θ*<input type="range" id="sAng" min="15" max="60" step="1"><b id="vAng"></b></label>
    <select class="btn" id="selCar" data-tip="Wheelbase, overhangs and lock all change R = p / tan δ — and with it every number on this screen. Park one car well, then transfer."></select>
    <button class="btn p" id="btnReset" data-tip="Back to the start pose. Your clean streak survives a reset; it does not survive a contact.">RESET<k>R</k></button>
    <button class="btn" id="btnPlay" data-tip="Play or pause the machine run."><svg class="i"><use href="#i-play"/></svg> AI<k>P</k></button>
    <span id="subMin" style="font-size:11px;color:var(--dim)"></span>
  </div>
  <div class="row" id="drive">
    <button class="big" id="bRev" data-tip="Hold to reverse."><svg class="i"><use href="#i-lf"/></svg> REVERSE</button>
    <button class="big" id="bBite" data-tip="One 25 cm bite backwards.">BITE <svg class="i"><use href="#i-lf"/></svg></button>
    <button class="big" id="bFwd" data-tip="Hold to move forward.">FORWARD <svg class="i"><use href="#i-rt"/></svg></button>
  </div>
</div>

<div id="more"></div>

<script>
/* KERB LAB v3 — geometry + planner core (shared verbatim with the page) */
var KERB_OFF=0.30, PW=1.78, PL=4.50;
var PRESETS=[
 {n:"supermini",L:3.98,W:1.75,p:2.55,r:0.72,T:10.0,tr:1.50},
 {n:"hatch",    L:4.28,W:1.79,p:2.62,r:0.80,T:10.9,tr:1.54},
 {n:"saloon",   L:4.71,W:1.83,p:2.85,r:0.95,T:11.4,tr:1.57},
 {n:"midSUV",   L:4.62,W:1.86,p:2.68,r:0.90,T:11.4,tr:1.60},
 {n:"lgSUV",    L:4.92,W:2.00,p:2.98,r:1.02,T:12.3,tr:1.68},
 {n:"vanSWB",   L:4.86,W:2.06,p:2.93,r:0.95,T:12.4,tr:1.72},
 {n:"vanLWB",   L:5.98,W:2.07,p:3.75,r:1.15,T:14.8,tr:1.75}
];
var CAR={L:4.28,W:1.79,p:2.62,rear:0.80,track:1.54,T:10.9,front:0.86,dmax:0,R:4.0};
function recompute(){
  CAR.front=Math.max(0.35,CAR.L-CAR.rear-CAR.p);
  var Rfw=CAR.T/2,R;
  if(CAR.T>0&&Rfw>CAR.p*1.05) R=Math.sqrt(Math.max(0.01,Rfw*Rfw-CAR.p*CAR.p))-CAR.track/2;
  else R=1.55*CAR.p;
  CAR.R=Math.max(2.4,R); CAR.dmax=Math.atan(CAR.p/CAR.R);
}
var D=function(x){return x*180/Math.PI;}, Rad=function(x){return x*Math.PI/180;};
function corners(x,y,th,c){
  c=c||CAR; var co=Math.cos(th),si=Math.sin(th),h=c.W/2;
  var P=[[c.p+c.front,h],[c.p+c.front,-h],[-c.rear,-h],[-c.rear,h]];

/* ---------------- planners ---------------- */
function targetY(){return KERB_OFF+CAR.W/2;}

  segs.push({turn:-1});

  segs.push({turn:0});

/* shuffle cycles: 4 arcs, wheel flipped stationary.

       note:'THE MYTH — v1\'s rule executed literally: "flip lock-to-lock when your kerb-side gap has closed to half". Watch where it stops.'},
      {turn:1},
      {gear:-1,steer:1,len:16,until:function(x,y,th){return th<=0.002;},

  /* fallback for every policy: harvest (analytic partial + trim), then approach+work-in */
  var fb=planHarvest(start,slot);
  if(fb){var ftr=simulate(start,fb.segs,slot); if(scoreTraj(ftr,slot,ty).ok){fb.label=name;return fb;}}
  var wi=planApproachWorkIn(start,slot);
  if(wi) return {segs:wi.segs,label:name,theta:wi.theta,workin:true};
  if(cands.length){cands.sort(function(a,b){return b.sc.minClr-a.sc.minClr;});
    return {segs:cands[0].plan.segs,label:name,theta:cands[0].theta,pick:cands[0]};}
  return {segs:[],label:name,failed:true};
}
/* sub-minimum gap: buy the angle that fits, spend it straight, unwind early, then trim */
function planHarvest(start,slot){
  var ty=targetY(), win=slotXWindow(slot), bestP=null,bestSc=null,bi;
  for(var thd=18;thd<=60;thd+=2){
    for(var frac=1.0;frac>=0.25;frac-=0.125){
      var t=Rad(thd), R=CAR.R;
      var arc=2*R*(1-Math.cos(t)), d=start[1]-ty;
      var s=(d*frac-arc)/Math.sin(t);
      if(s<-0.001) continue; if(s<0) s=0;
      var X=2*R*Math.sin(t)+s*Math.cos(t), fx=start[0]-X;
      var adjust=0;
      if(fx<win[0]) adjust=win[0]-fx; else if(fx>win[1]) adjust=win[1]-fx;
      if(win[1]<win[0]) return null;
      var segs=[];
      if(Math.abs(adjust)>0.02) segs.push({gear:adjust>0?1:-1,steer:0,len:Math.abs(adjust),
        note:'reposition '+(adjust>0?'forward':'back')+' '+Math.abs(adjust).toFixed(2)+' m'});
      segs.push({turn:-1});
      segs.push({gear:-1,steer:-1,len:R*t,note:'BUY ANGLE — this gap is under your one-move minimum, so take what angle fits'});
      segs.push({turn:0});
      if(s>0.02) segs.push({gear:-1,steer:0,len:s,note:'SPEND ANGLE straight'});
      segs.push({turn:1});
      segs.push({gear:-1,steer:1,len:R*t,note:'UNWIND to parallel, deliberately short of the kerb'});
      segs.push({turn:0});
      var tr=simulate(start,segs,slot);
      if(tr.contact) continue;
      var f=finalState(tr), C=corners(f.x,f.y,f.th);
      if(!C.every(function(p){return p[0]>-0.02&&p[0]<slot+0.02;})) continue;
      if(Math.abs(D(f.th))>2) continue;
      var need=f.y-ty; if(need<-0.02) continue;
      var sh=planShuffleIterative([f.x,f.y,f.th],slot,0.28,14);
      var n=sh.n;
      var full=segs.concat(sh.segs);
      var tr2=simulate(start,full,slot);
      if(tr2.contact) continue;
      var sc=scoreTraj(tr2,slot,ty);
      if(!sc.ok) continue;
      var cost=sc.moves*1.0-sc.minClr*4;
      if(!bestSc||cost<bestSc){bestSc=cost;bestP={segs:full,theta:thd,n:n};}
    }
  }
  return bestP;
}

/* ==================================================================
   KERB LAB v3 — rig
   One trajectory type. The user makes one. The machine makes one.
   Everything else is a view onto the difference between them.
   ================================================================== */
var $=function(s){return document.querySelector(s);};
var cv=$('#cv'), ctx=cv.getContext('2d'), stage=$('#stage');
var LS={
  get:function(k,d){try{var v=localStorage.getItem('kl3.'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem('kl3.'+k,JSON.stringify(v));}catch(e){}}
};

/* ---------------- state ---------------- */
var S={
  mode:'drive', pol:LS.get('pol','margin'),
  carIdx:LS.get('car',1),
  gapExtra:LS.get('gapExtra',null),   // slot = CAR.L + gapExtra; null → set from one-move minimum
  out:LS.get('out',0.90),             // lateral offset from parked flank
  thStar:LS.get('thStar',null),   // null → centre of the feasible band
  rot:LS.get('rot',false), env:LS.get('env',false), band:LS.get('band',false),
  showPreview:LS.get('preview',true), showHint:LS.get('hint',true),
  slot:6.0,
  pose:[0,0,0], delta:0, gear:0, dist:0,
  hist:[], head:-1, ghostFuture:[], marks:[],
  blocked:null, blockT:0, contacts:0, moves:0, lastGear:0,
  start:[0,0,0],
  ai:null, aiDist:0, aiPlay:false, aiPolicyOf:null,
  predictAt:-1, predictScore:[0,0],
  keys:{}, held:{fwd:false,rev:false,spc:false}, gear:-1, steerCmd:0,
  done:false, verdictT:0, streak:LS.get('streak',0),
  divPeak:0, divPeakAt:null
};
function slotLen(){return CAR.L+S.gapExtra;}

/* ---------------- setup / reset ---------------- */
function applyCar(){
  var P=PRESETS[S.carIdx];
  CAR.L=P.L;CAR.W=P.W;CAR.p=P.p;CAR.rear=P.r;CAR.T=P.T;CAR.track=P.tr;recompute();
  S.minSlot=minSlot();
  if(S.gapExtra===null||S.gapExtra===undefined){
    S.gapExtra=+(S.minSlot-CAR.L+0.45).toFixed(2); LS.set('gapExtra',S.gapExtra);
  }
}
function canonicalStart(){
  // where the page places you: alongside, `out` clear of the parked flank
  var d=PW+S.out, t=Rad(S.thStar), R=CAR.R;
  var s=(d-2*R*(1-Math.cos(t)))/Math.sin(t); if(!(s>0)) s=0;
  /* Derived from the master equation, never clamped: this x is the whole point.
     Start here and the arc-straight-arc lands the rear axle inside the window. */
  var x=CAR.rear+0.30+2*R*Math.sin(t)+s*Math.cos(t);
  return [x, targetY()+d, 0];
}
function computeBand(){
  if(S.thUser===undefined) S.thUser = LS.get('thStar',null)!==null;
  var lo=null,hi=null,st=[S.start[0],S.start[1],S.start[2]];
  /* 0.5 deg resolution: at the one-move minimum the feasible window is narrower
     than a degree, and a 1 deg scan reports "no band" for a slot that does fit. */
  for(var t=16;t<=64;t+=0.5){
    var p=planCanonical(st,S.slot,t,true); if(!p) continue;
    if(!scoreTraj(simulate(st,p.segs,S.slot),S.slot,targetY()).ok) continue;
    if(lo===null) lo=t; hi=t;
  }
  S.bandLo=lo; S.bandHi=hi;
  /* theta* follows the band unless the learner has deliberately set it. Seeding it
     once and persisting it is how v3 ended up recommending 40 deg inside a 23-38 band. */
  /* No band = sub-minimum slot. Staging then follows a 40 deg approach, which is the
     pose the work-in planner is verified from; a leftover shallow theta* pushes the
     start 4 m back down the road and leaves it with no route in at all. */
  if(!S.thUser) S.thStar = (lo===null ? 40 : Math.round((lo+hi))/2);
}
function reset(keepAI){
  applyCar(); S.slot=slotLen();
  if(S.thStar===null||S.thStar===undefined) S.thStar=40;   // provisional, so the start pose is well-defined
  S.start=canonicalStart(); computeBand();
  S.start=canonicalStart(); computeBand();                  // settle: start pose and theta* must agree
  S.pose=[S.start[0],S.start[1],S.start[2]];
  S.delta=0;S.gear=-1;S.dist=0;S.lastGear=0;S.moves=0;S.contacts=0;
  S.hist=[[S.pose[0],S.pose[1],S.pose[2],0,0,0]]; S.head=0;
  S.ghostFuture=[]; S.marks=[]; S.blocked=null; S.done=false; S.verdictT=0;
  S.divPeak=0; S.divPeakAt=null; S.aiDist=0;
  if(!keepAI) S.ai=null;
  if(S.mode!=='drive') buildAI();
  $('#verdict').style.opacity=0;
  syncKnobs();
}
function buildAI(){
  var t0=performance.now();
  var p=planPolicy(S.pol,[S.start[0],S.start[1],S.start[2]],S.slot);
  var tr=simulate([S.start[0],S.start[1],S.start[2]],p.segs,S.slot);
  var sc=scoreTraj(tr,S.slot,targetY());
  S.ai={plan:p,tr:tr,sc:sc,ms:Math.round(performance.now()-t0),
        none:!p.segs.length||p.failed};
  S.aiPolicyOf=S.pol; S.aiDist=0; S.predictAt=-1;
  if(S.ai.none){
    var v=$('#verdict');
    v.style.color='var(--warn)';
    v.innerHTML='NO SOLUTION<small>'+S.pol.toUpperCase()+' cannot park in '+S.slot.toFixed(2)+' m.<br>'+
      'This car needs '+S.minSlot.toFixed(2)+' m for one manoeuvre. Open the gap with <b>]</b>, '+
      'or switch to MAX-MARGIN and let it work the car in.</small>';
    v.style.opacity=1; S.aiPlay=false;
  }
}

/* ---------------- trajectory helpers ---------------- */
function sampleAt(samples,dist){          // arc-length lookup
  if(!samples.length) return null;
  var lo=0,hi=samples.length-1;
  if(dist<=samples[0][5]) return samples[0];
  if(dist>=samples[hi][5]) return samples[hi];
  while(hi-lo>1){var m=(lo+hi)>>1; if(samples[m][5]<=dist) lo=m; else hi=m;}
  var a=samples[lo],b=samples[hi],sp=b[5]-a[5],u=sp>1e-9?(dist-a[5])/sp:0;
  return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u,a[3],b[4],dist];
}
function totalDist(t){return t&&t.samples.length?t.samples[t.samples.length-1][5]:0;}

/* ---------------- physics ---------------- */
var STEER_RATE=1.35, SNAP_RATE=3.0, SPEED=0.95, BITE=0.25, NIP=0.05, DT=1/120;
var biteQueue=0;
/* SPACE is hold-to-drive in the ARMED GEAR. ↑/↓ still drive directly and every
   press re-arms that gear, so the badge on the car never lies about what SPACE
   will do next. */
function heldF(){return S.held.fwd||(S.held.spc&&S.gear>0);}
function heldR(){return S.held.rev||(S.held.spc&&S.gear<0);}
function tryStep(ds){
  var n=stepPose(S.pose,ds,S.delta);
  var OB=obstacles(S.slot), C=corners(n[0],n[1],n[2]), fp=flankPoint(n[0],n[1],n[2]);
  var hit=null,i;
  if(fp[1]<0) hit='the kerb';
  for(i=0;i<4&&!hit;i++) if(C[i][1]<0) hit='the kerb';
  if(!hit&&overlap(C,OB[0])) hit='the car behind';
  if(!hit&&overlap(C,OB[1])) hit='the car ahead';
  if(hit){
    if(S.blocked!==hit){S.contacts++;S.marks.push({s:S.dist,d:true,text:'CONTACT — '+hit});}
    S.blocked=hit;S.blockT=performance.now();
    if(navigator.vibrate) try{navigator.vibrate(28);}catch(e){}
    return false;
  }
  S.blocked=null;
  var g=ds>0?1:-1;
  if(S.lastGear!==0&&g!==S.lastGear) S.moves++;
  S.lastGear=g;
  S.pose=n; S.dist+=Math.abs(ds);
  if(S.head<S.hist.length-1){ S.ghostFuture=S.hist.slice(S.head+1); S.hist.length=S.head+1; }
  S.hist.push([n[0],n[1],n[2],S.delta,g,S.dist]); S.head=S.hist.length-1;
  return true;
}
function physics(dt){
  if(S.done) return;
  // steering slew
  var tgt=S.steerCmd*CAR.dmax, rate=(S.snap?SNAP_RATE:STEER_RATE)*CAR.dmax;
  if(S.delta<tgt) S.delta=Math.min(tgt,S.delta+rate*dt);
  else if(S.delta>tgt) S.delta=Math.max(tgt,S.delta-rate*dt);
  var slewing=Math.abs(S.delta-tgt)>1e-4;
  if(!slewing){S.delta=tgt;S.snap=false;}
  /* Dry steer. A lock-to-lock flip takes over a metre of travel if you do it
     rolling, which is why the textbook manoeuvre is drawn as stationary wheel
     flips — and why the planner models them that way. Q / E / Z hold the
     car still until the wheel arrives, then motion resumes by itself. */
  if(S.snap&&slewing){S.wheelBusy=true;return;}
  S.wheelBusy=false;
  // travel
  var ds=0;
  if(biteQueue!==0){
    var q=Math.sign(biteQueue), step=Math.min(Math.abs(biteQueue),SPEED*1.8*dt);
    ds=q*step; biteQueue-=ds;
    if(Math.abs(biteQueue)<1e-4) biteQueue=0;
  } else if(heldF()!==heldR()){
    ds=(heldF()?1:-1)*SPEED*dt;
  }
  if(ds!==0) tryStep(ds);
  checkDone();
}
function checkDone(){
  if(S.done||Math.abs(S.pose[2])>Rad(5)) return;
  var g=flankGap(S.pose[0],S.pose[1],S.pose[2]);
  var C=corners(S.pose[0],S.pose[1],S.pose[2]);
  var inSlot=C.every(function(p){return p[0]>-0.10&&p[0]<S.slot+0.10;});
  if(inSlot&&g>0.15&&g<0.45&&!heldF()&&!heldR()&&biteQueue===0&&S.dist>1.0) finish(true);
}
function finish(ok){
  S.done=true;S.verdictT=performance.now();
  var g=flankGap(S.pose[0],S.pose[1],S.pose[2]);
  var v=$('#verdict');
  if(ok&&S.contacts===0){S.streak++;LS.set('streak',S.streak);
    v.style.color='var(--acc)';
    v.innerHTML='PARKED<small>'+(g*100).toFixed(0)+' cm · '+D(S.pose[2]).toFixed(1)+'° · '+S.moves+
      ' moves · '+S.dist.toFixed(1)+' m<br>clean streak '+S.streak+
      (g>0.40?'<br>wide — in a slot this tight that is the honest best; SHUFFLE (4) trims '+
        (100*(2*(2*CAR.R-Math.sqrt(Math.max(0,4*CAR.R*CAR.R-1)))) ).toFixed(0)+' cm a cycle':'')+'</small>';
  }else{S.streak=0;LS.set('streak',0);
    v.style.color=ok?'var(--warn)':'var(--bad)';
    v.innerHTML=(ok?'PARKED, DIRTY':'STOPPED')+'<small>'+S.contacts+' contact'+(S.contacts===1?'':'s')+
      ' · '+(g*100).toFixed(0)+' cm · '+D(S.pose[2]).toFixed(1)+'°<br>streak reset</small>';
  }
  v.style.opacity=1;
}

/* ------------------------------------------------------------------
   UNWIND PREVIEW — the instrument this whole rig exists for.
   "If I flipped to full lock away RIGHT NOW and reversed to parallel,
    where would I stop, and would I touch anything on the way?"
   RESERVE=0 tells you the rear axle lands on target. It says nothing
   about whether your kerb-side rear corner survives the swing. This does.
   ------------------------------------------------------------------ */
var PV={t:0,key:''};
function updatePreview(){
  /* Computed unconditionally. The U toggle hides the overlay; it must not silently
     disable the FLIP NOW cue that depends on it — the persona pass found a learner
     who faded the aid and then drove into the kerb with the coach mute. */
  var th=S.pose[2];
  // Only meaningful once the debt is nearly spent. Earlier than that the unwind
  // arc simply runs into the car behind — true, but not the question being asked.
  var debt=S.pose[1]-targetY(), U=CAR.R*(1-Math.cos(Math.abs(th)));
  if(Math.abs(th)<Rad(2)||debt-U>0.40){S.preview=null;return;}
  var key=S.pose[0].toFixed(2)+','+S.pose[1].toFixed(2)+','+th.toFixed(3)+','+S.slot.toFixed(2);
  if(key===PV.key) return; PV.key=key;
  var sgn=th>0?1:-1;
  var segs=[{turn:sgn},{gear:-1,steer:sgn,len:CAR.R*Math.abs(th)+0.8,
    until:function(x,y,t){return sgn>0?t<=0.002:t>=-0.002;}}];
  var tr=simulate([S.pose[0],S.pose[1],S.pose[2]],segs,S.slot);
  var f=finalState(tr);
  S.preview={samples:tr.samples,minClr:tr.minClr,contact:tr.contact,
    gap:flankGap(f.x,f.y,f.th),end:f};
}
function drawPreview(){
  var pv=S.preview; if(!pv||!S.showPreview) return;
  var bad=pv.contact||pv.minClr<0.06, warn=!bad&&(pv.minClr<0.14||pv.gap<0.15||pv.gap>0.45);
  var col=bad?'rgba(248,113,113,.70)':(warn?'rgba(251,191,36,.65)':'rgba(34,211,238,.60)');
  drawPath(pv.samples,col,1.3,[5,4]);
  poly(corners(pv.end.x,pv.end.y,pv.end.th),null,col,1.3,[4,4]);
  if(pv.contact&&pv.samples.length){
    var s=pv.samples[pv.samples.length-1], p=P2(s[0],s[1]);
    ctx.fillStyle='#f87171';ctx.font='700 10px ui-monospace,SFMono-Regular,Menlo,monospace';ctx.textAlign='center';
    var tw=ctx.measureText(pv.contact).width;
    xMark(p[0]-tw/2-7,p[1]-11.5,3.4,'#f87171');
    ctx.fillText(pv.contact,p[0]+4,p[1]-8);
  }
}

/* Where the flip WILL be, not where it is. The green window is ~0.4 m of travel
   wide and the preview number falls ~10 cm per tenth of a second inside it, so a
   driver reacting to the number is always late. This paints the point on the ground
   and counts the distance down, which is what a mirror-checking human can act on. */
function reserveDistance(){                      // where RESERVE hits zero
  var th=Math.abs(S.pose[2]); if(th<Rad(2)) return null;
  var dR=(S.pose[1]-targetY())-CAR.R*(1-Math.cos(th));
  return dR/Math.max(0.05,Math.sin(th));
}
/* RESERVE = 0 says the rear axle lands on the target line. It does NOT say the
   kerb-side rear corner survives the swing, and on a long wheelbase it does not:
   the persona pass parked a LWB van at a textbook-perfect RESERVE = 0 and clipped
   the car behind. So the marker solves for the earliest point whose unwind actually
   clears, and only falls back to the RESERVE point when nothing does. */
var FS={key:'',val:null,gap:null,clr:null};
function flipDistance(){
  var th=S.pose[2], A=Math.abs(th); if(A<Rad(2)) return null;
  var L0=reserveDistance();
  var key=S.pose[0].toFixed(2)+','+S.pose[1].toFixed(2)+','+th.toFixed(3)+','+S.slot.toFixed(2);
  if(key===FS.key) return FS.val;
  FS.key=key;
  var sgn=th>0?1:-1, best=null, u;
  for(u=Math.max(0,L0-1.2); u<=L0+1.2; u+=0.05){
    var q=stepPose([S.pose[0],S.pose[1],th],-u,0);          // straight-back to the candidate
    var segs=[{turn:sgn},{gear:-1,steer:sgn,len:CAR.R*A+0.8,
      until:(function(g){return function(x,y,t){return g>0?t<=0.002:t>=-0.002;};})(sgn)}];
    var tr=simulate(q,segs,S.slot);
    if(tr.contact||tr.minClr<0.07) continue;
    var f=finalState(tr), g=flankGap(f.x,f.y,f.th);
    if(g<0.15||g>0.45) continue;
    var cost=Math.abs(g-0.30)+Math.max(0,0.12-tr.minClr)*2.0;   // 30 cm is the aim; clearance buys it back
    if(!best||cost<best.cost) best={u:u,cost:cost,gap:g,clr:tr.minClr};
  }
  FS.val = best?best.u:L0; FS.gap = best?best.gap:null; FS.clr = best?best.clr:null;
  return FS.val;
}
function drawFlipMark(){
  var L=flipDistance(); if(L===null||L<-0.6||L>6) return;
  var th=S.pose[2], x=S.pose[0]-L*Math.cos(th), y=S.pose[1]-L*Math.sin(th);
  var a=P2(x-0.9*Math.sin(th),y+0.9*Math.cos(th)), b=P2(x+0.9*Math.sin(th),y-0.9*Math.cos(th));
  var near=Math.abs(L)<0.12, col=L<-0.05?'#f87171':(near?'#4ade80':'rgba(74,222,128,.55)');
  ctx.save();
  ctx.strokeStyle=col; ctx.lineWidth=near?2.4:1.4; ctx.setLineDash(near?[]:[6,4]);
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=col; ctx.font='700 10px ui-monospace,monospace'; ctx.textAlign='center';
  ctx.fillText(L<-0.05?'PAST FLIP':('FLIP '+(L<=0.05?'NOW':'in '+L.toFixed(2)+' m')),a[0],a[1]-6);
  ctx.restore();
}

/* ------------------------------------------------------------------
   BEST LINE FROM HERE — computed whenever you stop moving.
   Not "what should you have done", which is useless once you are wrong,
   but "what is optimal from exactly where you now are". It costs a few
   hundred milliseconds, so it only runs while the car is stationary,
   which is also the only moment a driver can use it.
   ------------------------------------------------------------------ */
var HINT={key:'',idle:0,busy:false};
function maybeHint(){
  if(!S.showHint||S.done||S.mode!=='drive'){S.hint=null;return;}
  if(S.gearDir()!==0){S.hint=null;HINT.idle=performance.now();HINT.key='';return;}
  if(performance.now()-HINT.idle<450||HINT.busy) return;
  var key=S.pose[0].toFixed(2)+','+S.pose[1].toFixed(2)+','+S.pose[2].toFixed(3)+','+S.slot.toFixed(2);
  if(key===HINT.key) return;
  HINT.key=key; HINT.busy=true;
  setTimeout(function(){
    try{
      var st=[S.pose[0],S.pose[1],S.pose[2]];
      var p=planPolicy('margin',st,S.slot);
      var tr=simulate(st,p.segs,S.slot), sc=scoreTraj(tr,S.slot,targetY());
      S.hint=(!p.segs.length||p.failed||!sc.ok)?{none:true}:{tr:tr,sc:sc,first:firstAction(p.segs)};
    }catch(e){S.hint={none:true};}
    HINT.busy=false;
  },0);
}
function firstAction(segs){
  for(var i=0;i<segs.length;i++){
    if(segs[i].turn!==undefined) return segs[i].turn<0?'FULL LOCK TOWARD KERB':(segs[i].turn>0?'FULL LOCK AWAY':'WHEEL STRAIGHT');
    if(segs[i].gear) return segs[i].gear<0?'REVERSE':'FORWARD';
  }
  return '';
}
function drawHint(){
  var h=S.hint; if(!h||h.none) return;
  drawPath(h.tr.samples,'rgba(34,211,238,.55)',1.6,[7,5]);
  var f=finalState(h.tr);
  poly(corners(f.x,f.y,f.th),null,'rgba(34,211,238,.5)',1.3,[5,4]);
}

/* ---------------- view transform ---------------- */
var VIEW={sx:1,sy:1,ox:0,oy:0,k:30};
function fitView(){
  var r=stage.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var w=r.width,h=r.height;
  var x0=-2.3, x1=Math.max(S.slot+2.3, S.start[0]+CAR.p+CAR.front+0.7);
  var y0=-0.55, y1=Math.max(4.3, targetY()+PW+S.out+1.5);
  var spanA=x1-x0, spanB=y1-y0;
  var k;
  if(S.rot){ k=Math.min((w-16)/spanB,(h-16)/spanA); }
  else     { k=Math.min((w-16)/spanA,(h-16)/spanB); }
  VIEW.k=k;
  VIEW.cx=(x0+x1)/2; VIEW.cy=(y0+y1)/2; VIEW.w=w; VIEW.h=h;
}
function W2S(x,y){
  var k=VIEW.k;
  if(S.rot) return [VIEW.w/2+(VIEW.cy-y)*k, VIEW.h/2+(VIEW.cx-x)*k*-1*-1 - 0];
  return [VIEW.w/2+(x-VIEW.cx)*k, VIEW.h/2-(y-VIEW.cy)*k];
}
/* rotate: road runs bottom→top, kerb on the left */
function P2(x,y){
  var k=VIEW.k;
  if(S.rot) return [VIEW.w/2-(y-VIEW.cy)*k, VIEW.h/2-(x-VIEW.cx)*k];
  return [VIEW.w/2+(x-VIEW.cx)*k, VIEW.h/2-(y-VIEW.cy)*k];
}

/* ---------------- render ---------------- */
function poly(pts,fill,stroke,lw,dash){
  ctx.beginPath();
  for(var i=0;i<pts.length;i++){var p=P2(pts[i][0],pts[i][1]); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
  ctx.closePath();
  ctx.setLineDash(dash||[]);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1.4;ctx.stroke();}
  ctx.setLineDash([]);
}
function line(a,b,col,lw,dash){
  var p=P2(a[0],a[1]),q=P2(b[0],b[1]);
  ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);
  ctx.setLineDash(dash||[]);ctx.strokeStyle=col;ctx.lineWidth=lw||1;ctx.stroke();ctx.setLineDash([]);
}
function carPath(x,y,th,fill,stroke,lw,dash){
  var C=corners(x,y,th);
  poly(C,fill,stroke,lw,dash);
  // nose bar + rear-axle tick: the two references that actually matter
  var co=Math.cos(th),si=Math.sin(th);
  function L(a,b){return [x+a*co-b*si,y+a*si+b*co];}
  line(L(CAR.p+CAR.front-0.12,-CAR.W/2+0.1),L(CAR.p+CAR.front-0.12,CAR.W/2-0.1),stroke,lw||1.4);
  return C;
}
function draw(){
  fitView();
  var w=VIEW.w,h=VIEW.h;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#070a0e';ctx.fillRect(0,0,w,h);

  var x0=-2.3,x1=Math.max(S.slot+2.3,S.start[0]+CAR.p+CAR.front+0.7),
      yTop=Math.max(4.3,targetY()+PW+S.out+1.5);
  // road + pavement
  poly([[x0,-0.55],[x1,-0.55],[x1,0],[x0,0]],'#1b2027',null);
  poly([[x0,0],[x1,0],[x1,yTop],[x0,yTop]],'#0d1116',null);
  line([x0,0],[x1,0],'#3b4654',2.5);
  // lane hint
  line([x0,targetY()+PW+1.9],[x1,targetY()+PW+1.9],'#1e2530',1.5,[10,10]);

  // parked cars
  var OB=obstacles(S.slot);
  poly(OB[0],'#1a2430','#2f3d4e',1.4);
  poly(OB[1],'#1a2430','#2f3d4e',1.4);
  // slot mouth markers
  line([0,0],[0,KERB_OFF+PW+0.35],'#f8717155',1.4,[5,5]);
  line([S.slot,0],[S.slot,KERB_OFF+PW+0.35],'#f8717155',1.4,[5,5]);

  // target box
  var win=slotXWindow(S.slot);
  if(win[1]>win[0]){
    var tx=(win[0]+win[1])/2;
    poly(corners(tx,targetY(),0),'rgba(74,222,128,.05)','rgba(74,222,128,.32)',1.2,[6,5]);
  }

  // θ band instrument
  if(S.band){
    /* mid-drag the band belongs to the old slot — show it ghosted rather than
       lying about it, and let reset() re-solve it on release */
    if(S.dragBand){ctx.save();ctx.globalAlpha=0.22;drawBand();ctx.restore();}
    else drawBand();
  }

  // swept envelope of the live run
  if(S.env) drawEnvelope(S.hist,'rgba(34,211,238,.13)');

  // where you land if you flip to unwind right now
  updatePreview(); drawPreview(); drawFlipMark();
  maybeHint(); drawHint();

  // abandoned future (branch ghost)
  if(S.ghostFuture.length) drawPath(S.ghostFuture,'rgba(140,150,165,.35)',1,[4,4]);

  // AI trajectory
  if(S.ai&&S.mode!=='drive'){
    drawPath(S.ai.tr.samples,'rgba(167,139,250,.45)',1.4,[]);
    var ad=aiHeadDist();
    var a=sampleAt(S.ai.tr.samples,ad);
    if(a){
      carPath(a[0],a[1],a[2],'rgba(167,139,250,.10)','rgba(167,139,250,.85)',1.6,[5,4]);
      if(S.mode==='compare'&&S.dist>0.05) drawDivergence(a);
    }
  }

  // user path
  drawPath(S.hist,'rgba(74,222,128,.55)',1.6,[]);

  // ego
  var blocked=S.blocked&&performance.now()-S.blockT<450;
  var col=blocked?'#f87171':(S.done?'#4ade80':'#e8edf4');
  carPath(S.pose[0],S.pose[1],S.pose[2],'rgba(232,237,244,.07)',col,2);
  drawWheels();
  drawGearBadge();
  // instantaneous centre + turn circle
  if(Math.abs(S.delta)>1e-3) drawICR();

  // clearance whisker: nearest point on the whole body to anything
  drawWhisker();

  // marks on timeline
  drawHUD();
  tipTick();
}
/* The armed gear is a mode, and an invisible mode is a trap. It rides on the
   car itself, lit while the car is actually moving. */
function drawGearBadge(){
  var q=P2(S.pose[0]+CAR.p*0.42*Math.cos(S.pose[2]),S.pose[1]+CAR.p*0.42*Math.sin(S.pose[2]));
  var live=heldF()||heldR()||biteQueue!==0;
  var r=Math.max(8.5,VIEW.k*0.24);
  ctx.save();
  ctx.beginPath();ctx.arc(q[0],q[1],r,0,6.2832);
  ctx.fillStyle=live?'rgba(74,222,128,.92)':'rgba(8,12,17,.80)';ctx.fill();
  ctx.lineWidth=1.3;ctx.strokeStyle=live?'#4ade80':'rgba(232,237,244,.40)';ctx.stroke();
  ctx.fillStyle=live?'#04120a':'#e8edf4';
  ctx.font='700 '+Math.round(r*1.2)+'px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(S.gear<0?'R':'D',q[0],q[1]+0.5);
  ctx.restore();
}
function xMark(x,y,r,col){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);
  ctx.stroke();ctx.restore();
}
function drawPath(samples,col,lw,dash){
  if(samples.length<2) return;
  ctx.beginPath();
  for(var i=0;i<samples.length;i++){
    var p=P2(samples[i][0],samples[i][1]);
    i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);
  }
  ctx.setLineDash(dash||[]);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke();ctx.setLineDash([]);
}
function drawEnvelope(samples,col){
  if(samples.length<2) return;
  var last=-9;
  for(var i=0;i<samples.length;i++){
    if(samples[i][5]-last<0.30) continue; last=samples[i][5];
    poly(corners(samples[i][0],samples[i][1],samples[i][2]),col,null);
  }
}
function drawWheels(){
  var x=S.pose[0],y=S.pose[1],th=S.pose[2],co=Math.cos(th),si=Math.sin(th);
  function L(a,b){return [x+a*co-b*si,y+a*si+b*co];}
  var hw=CAR.W/2-0.10, r=0.33;
  [[0,hw],[0,-hw]].forEach(function(o){
    var c=L(o[0],o[1]);
    line([c[0]-r*co,c[1]-r*si],[c[0]+r*co,c[1]+r*si],'#64748b',3.5);
  });
  var fa=th+S.delta,fc=Math.cos(fa),fs=Math.sin(fa);
  [[CAR.p,hw],[CAR.p,-hw]].forEach(function(o){
    var c=L(o[0],o[1]);
    line([c[0]-r*fc,c[1]-r*fs],[c[0]+r*fc,c[1]+r*fs],
      Math.abs(Math.abs(S.delta)-CAR.dmax)<1e-3?'#4ade80':'#94a3b8',3.5);
  });
}
function drawICR(){
  var R=CAR.p/Math.tan(S.delta);
  var cx=S.pose[0]-R*Math.sin(S.pose[2]), cy=S.pose[1]+R*Math.cos(S.pose[2]);
  var c=P2(cx,cy);
  ctx.beginPath();ctx.arc(c[0],c[1],4,0,7);ctx.fillStyle='rgba(251,191,36,.8)';ctx.fill();
  ctx.beginPath();ctx.arc(c[0],c[1],Math.abs(R)*VIEW.k,0,7);
  ctx.setLineDash([3,6]);ctx.strokeStyle='rgba(251,191,36,.22)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
  line([cx,cy],[S.pose[0],S.pose[1]],'rgba(251,191,36,.28)',1,[3,4]);
}
function drawWhisker(){
  var C=corners(S.pose[0],S.pose[1],S.pose[2]);
  var OB=obstacles(S.slot), best=1e9,bp=null,bq=null,i,j;
  var fp=flankPoint(S.pose[0],S.pose[1],S.pose[2]);
  var cand=C.concat([fp]);
  for(i=0;i<cand.length;i++){ if(cand[i][1]<best){best=cand[i][1];bp=cand[i];bq=[cand[i][0],0];} }
  for(i=0;i<OB.length;i++) for(j=0;j<C.length;j++){
    var Q=OB[i];
    for(var m=0;m<Q.length;m++){
      var d=segDist(C[j],Q[m],Q[(m+1)%Q.length]);
      if(d<best){best=d;bp=C[j];bq=nearestOn(C[j],Q[m],Q[(m+1)%Q.length]);}
    }
  }
  if(!bp) return;
  var col=best<0.10?'#f87171':(best<0.22?'#fbbf24':'rgba(148,163,184,.55)');
  line(bp,bq,col,1.4,[3,3]);
  var p=P2((bp[0]+bq[0])/2,(bp[1]+bq[1])/2);
  ctx.fillStyle=col;ctx.font='600 10px ui-monospace,monospace';
  ctx.textAlign='center';ctx.fillText((best*100).toFixed(0),p[0],p[1]-4);
  S.minClrNow=best;
}
function nearestOn(p,a,b){
  var vx=b[0]-a[0],vy=b[1]-a[1],L2=vx*vx+vy*vy||1e-9;
  var t=((p[0]-a[0])*vx+(p[1]-a[1])*vy)/L2;t=Math.max(0,Math.min(1,t));
  return [a[0]+t*vx,a[1]+t*vy];
}
function drawBand(){
  var lo=S.bandLo,hi=S.bandHi,st=[S.start[0],S.start[1],S.start[2]];
  if(lo===null||lo===undefined) return;
  [lo,S.thStar,hi].forEach(function(t,i){
    var p=planCanonical(st,S.slot,t,true); if(!p) return;
    var tr=simulate(st,p.segs,S.slot);
    drawPath(tr.samples,i===1?'rgba(251,191,36,.75)':'rgba(251,191,36,.22)',i===1?1.6:1.1,i===1?[]:[3,4]);
    var f=finalState(tr);
    if(i===1) poly(corners(f.x,f.y,f.th),null,'rgba(251,191,36,.45)',1.2,[4,4]);
  });
}
function aiHeadDist(){
  if(!S.ai) return 0;
  if(S.mode==='compare') return Math.min(S.dist,totalDist(S.ai.tr));
  return S.aiDist;
}
function drawDivergence(a){
  var d=Math.hypot(a[0]-S.pose[0],a[1]-S.pose[1]);
  if(d>S.divPeak){S.divPeak=d;S.divPeakAt=[[a[0],a[1]],[S.pose[0],S.pose[1]],S.dist];}
  var col=d<0.15?'rgba(74,222,128,.6)':(d<0.4?'rgba(251,191,36,.75)':'rgba(248,113,113,.85)');
  line([a[0],a[1]],[S.pose[0],S.pose[1]],col,1.6,[4,3]);
  var p=P2((a[0]+S.pose[0])/2,(a[1]+S.pose[1])/2);
  ctx.fillStyle=col;ctx.font='700 11px ui-monospace,monospace';ctx.textAlign='center';
  ctx.fillText((d*100).toFixed(0)+' cm',p[0],p[1]-5);
}

/* ---------------- HUD ---------------- */
var hudEl=$('#hud');
var HTIP={};                       // live tooltip text per HUD row, rebuilt every frame
function fmt(v,u){return v.toFixed(u===0?0:2);}
function eq(){ // a worked substitution beats a definition: same maths, this car, this instant
  return '<span class="m">'+Array.prototype.join.call(arguments,'')+'</span>';
}
function drawHUD(){
  var x=S.pose[0],y=S.pose[1],th=S.pose[2];
  var gap=flankGap(x,y,th), ang=D(th);
  var debt=y-targetY(), U=CAR.R*(1-Math.cos(Math.abs(th))), dR=debt-U;
  var clr=S.minClrNow===undefined?0:S.minClrNow;
  function row(k,v,c,tip){ if(tip) HTIP[k]=tip;
    return '<div data-k="'+k+'"><i>'+k+'</i><b style="color:'+c+'">'+v+'</b></div>';}
  var gc=gap<0.15?'#f87171':(gap>0.45?'#fbbf24':'#4ade80');
  var rc=Math.abs(dR)<0.06?'#4ade80':(dR>0?'#22d3ee':'#f87171');
  var cc=clr<0.10?'#f87171':(clr<0.22?'#fbbf24':'#8d98a8');
  var pv=S.preview, pvRow='', fl=flipDistance();
  if(fl!==null&&fl>-0.6&&fl<8){
    /* the outcome of the flip, before you commit to it: the strongest prediction-error
       signal the rig can give, and the honest answer in a slot that only allows a wide finish */
    pvRow=row('FLIP IN',(fl<=0.05?'NOW':fl.toFixed(2)+' m')+(FS.gap!=null?'  → '+(FS.gap*100).toFixed(0)+' cm':''),
      fl<-0.05?'#f87171':(fl<0.12?'#4ade80':'#22d3ee'),
      'The solved flip point on the ground, and what flipping <i>there</i> lands you at — '+
      'so you can aim at it instead of reacting to a number that falls 10 cm every tenth of a second.'+
      eq(fl<=0.05?'flip now':'flip in '+fl.toFixed(2)+' m',
         FS.gap!=null?'  → '+(FS.gap*100).toFixed(0)+' cm, clearance '+(FS.clr*100).toFixed(0)+' cm':''));
  }
  if(pv){
    var pbad=pv.contact||pv.minClr<0.06, pwarn=!pbad&&(pv.minClr<0.14||pv.gap<0.15||pv.gap>0.45);
    pvRow+=row('IF FLIP',pv.contact?(ico('x')+' '+pv.contact):
      ((pv.gap*100).toFixed(0)+' cm · clr '+(pv.minClr*100).toFixed(0)),
      pbad?'#f87171':(pwarn?'#fbbf24':'#22d3ee'),
      'Where a full unwind from <i>this instant</i> puts you — the dashed ghost on the road. '+
      'Turn it off with <b>U</b> once you can call it yourself.'+
      eq(pv.contact?('hits '+pv.contact):((pv.gap*100).toFixed(0)+' cm from the kerb, '+
        (pv.minClr*100).toFixed(0)+' cm clearance')));
  }
  hudEl.innerHTML=
    row('GAP',(gap*100).toFixed(0)+' cm',gc,
      'Distance from your kerb-side flank to the kerb face. A legal, useful park is <b>15–45 cm</b>.'+
      eq('flank − kerb = ',(gap*100).toFixed(0),' cm'))+
    row('ANGLE',ang.toFixed(1)+'°','#e8edf4',
      'Your heading against the kerb line. Angle is stock you buy on lock and spend on the unwind.'+
      eq('θ = ',ang.toFixed(1),'°   R(1−cos θ) = ',(U*100).toFixed(0),' cm still owed to you'))+
    row('RESERVE',(dR>0?'+':'')+(dR*100).toFixed(0)+' cm',rc,
      'What the full unwind still owes you, minus what you still need. <b>Flip when this reads zero.</b> '+
      'Positive finishes wide, negative drives you into the kerb.'+
      eq('debt − U = (y − 0.30) − R(1−cos θ)')+
      eq('= ',debt.toFixed(2),' − ',U.toFixed(2),' = ',(dR>0?'+':''),dR.toFixed(2),' m'))+
    pvRow+
    row('CLEAR',(clr*100).toFixed(0)+' cm',cc,
      'Closest approach of any part of your body to anything solid — kerb, car behind, car ahead. '+
      'Under 10 cm is a paint-width from a claim.'+eq('min clearance = ',(clr*100).toFixed(0),' cm'))+
    row('MOVES',S.moves+(S.contacts?'  '+ico('x')+S.contacts:''),S.contacts?'#f87171':'#8d98a8',
      'Direction changes, not distance. The machine parks this slot in '+(S.ai?S.ai.sc.moves:1)+'.'+
      eq('moves ',S.moves,'   contacts ',S.contacts,'   travelled ',S.dist.toFixed(1),' m'))+
    (S.bandLo?row('θ BAND',S.bandLo+'–'+S.bandHi+'°'+(S.thStar<S.bandLo||S.thStar>S.bandHi?'  θ* OUT':''),
       (S.thStar<S.bandLo||S.thStar>S.bandHi)?'#f87171':'#fbbf24',
       'Every angle that parks <i>from this exact start pose</i> — press <b>B</b> to see it drawn. '+
       'Note it is not centred on 45°, and it is wider than the folklore admits.'+
       eq(S.bandLo,'° – ',S.bandHi,'°   your θ* = ',S.thStar,'°',
          (S.thStar<S.bandLo||S.thStar>S.bandHi)?'  ← outside' : '')):
      row('θ BAND','none — sub-minimum','#f87171',
       'No single arc-straight-arc parks this slot: it is below the one-move minimum. '+
       'It can still be worked in — that is what SHUFFLE is for.'+
       eq('slot ',S.slot.toFixed(2),' m < min ',(S.minSlot||0).toFixed(2),' m')))+
    (S.mode==='compare'&&S.divPeak>0.02?row('DIVERGE','max '+(S.divPeak*100).toFixed(0)+' cm','#a78bfa',
      'Furthest your body has ever been from the machine at the same distance travelled — '+
      'compared by metres driven, never by clock.'+eq('peak ',(S.divPeak*100).toFixed(0),' cm')):'')+
    (S.hint&&S.hint.none?row('BEST LINE','none from here','#f87171',
      'Nothing recovers this pose in one line. Pull forward and re-enter — that is not failure, it is the fix.'):
     (S.hint?row('BEST LINE',S.hint.sc.moves+' mv · '+S.hint.first,'#22d3ee',
      'Re-solved from where you are standing now, not from the start. Press <b>H</b> to hide it — '+
      'and do hide it once you are consistent, because reading it is not the same as knowing it.'):''));

  // phase + cue
  var ph='',cue='';
  var steerK=S.delta<-1e-3?-1:(S.delta>1e-3?1:0);
  /* FLIP NOW rides the solved marker, not the raw preview: the preview only turns
     green once you are already on top of the point, which is why the cue-follower
     persona kept stopping 46 cm out — one frame late is 10 cm of gap. */
  var fmark=flipDistance();
  var flipOK=(fmark!==null&&fmark<=0.08&&fmark>-0.10)||
             (pv&&!pv.contact&&pv.minClr>0.10&&pv.gap>0.15&&pv.gap<0.45);
  if(S.done){ph='';cue='';}
  else if(S.dist<0.05){ph='SET UP';
    cue=(S.bandLo&&(S.thStar<S.bandLo||S.thStar>S.bandHi))
      ? 'θ* = '+S.thStar+'° will not park in this gap. Only '+S.bandLo+'–'+S.bandHi+'° works here. Adjust with : and ".'
      : 'Rear bumper level with theirs, '+(S.out*100).toFixed(0)+' cm off their flank. Then reverse to θ* = '+S.thStar+'°.';}
  /* Overshoot alarm. Persona pass: a driver following IF FLIP literally never gets a
     green preview in a tight slot, keeps reversing on kerb-side lock and strikes the
     kerb while the cue is still calmly saying BUY ANGLE. Negative RESERVE is the one
     state the rig must interrupt on. */
  else if(dR<-0.08&&Math.abs(ang)>3&&S.gearDir()!==1){ph='PAST FLIP';
    cue='RESERVE '+(dR*100).toFixed(0)+' cm — you are past the flip point. Unwinding from here drives the kerb-side rear corner into the kerb. Stop, go FORWARD (W) on opposite lock to give the room back'+
        (S.hint&&!S.hint.none?', or take the BEST LINE: '+S.hint.first+'.':'.');}
  else if(flipOK&&steerK<=0){ph='FLIP NOW';
    cue='Both conditions met: RESERVE is spent AND the unwind clears. Full lock away — E is toward the kerb, Q is away.';}
  else if(S.gearDir()===-1&&steerK<0){ph='BUY ANGLE';
    cue=Math.abs(ang)>=S.thStar-1.5
      ? 'You are at θ*. Straighten the wheel (Z) and keep reversing — NEED tells you how far.'
      : 'Rotate, do not translate. Keep going to θ* = '+S.thStar+'°; the θ BAND shows which angles this gap allows.';}
  else if(S.gearDir()===-1&&steerK===0&&Math.abs(ang)>4){ph='SPEND ANGLE';
    cue='Straight back buys sin θ per metre — the cheapest lateral there is. Stop when RESERVE hits zero.';}
  else if(S.gearDir()===-1&&steerK>0){ph='UNWIND';cue='Full lock away. You get back exactly R(1−cos θ) — no more, no less.';}
  else if(S.gearDir()===1){ph='TRIM';cue='Forward with lock toward the kerb, back with lock away. Both reduce angle and gap at once.';}
  else if(Math.abs(dR)<0.06&&Math.abs(ang)>4&&!flipOK){ph='TOO MUCH ANGLE';
    cue='RESERVE is zero but the unwind will not clear. You bought more angle than this gap can spend — go forward and give some back.';}
  if(S.wheelBusy){ph='TURNING WHEEL';cue='Car held while the wheel swings — that is how the manoeuvre is drawn, and how it is driven.';}
  $('#phase').textContent=ph;
  $('#phase').style.color = ph==='PAST FLIP' ? '#f87171' : (ph==='FLIP NOW' ? '#4ade80' : '');
  $('#cue').style.color   = ph==='PAST FLIP' ? '#f87171' : '';
  $('#cue').textContent=cue;

  // timeline
  var tot=Math.max(S.hist[S.hist.length-1][5], S.ghostFuture.length?S.ghostFuture[S.ghostFuture.length-1][5]:0, 0.001);
  var cur=S.hist[Math.min(S.head,S.hist.length-1)][5];
  $('#tlfill').style.width=(100*S.hist[S.hist.length-1][5]/tot)+'%';
  $('#tlghost').style.left=(100*S.hist[S.hist.length-1][5]/tot)+'%';
  $('#tlghost').style.width=(100*(tot-S.hist[S.hist.length-1][5])/tot)+'%';
  $('#tlhead').style.left=(100*cur/tot)+'%';
  $('#tllab').textContent=cur.toFixed(2)+' m · '+S.moves+'mv';
  var mh='';

/* ---------------- loop ---------------- */
var acc=0,last=performance.now();
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000); last=t;
  acc+=dt;
  while(acc>=DT){physics(DT);acc-=DT;}
  if(S.aiPlay&&S.ai){
    S.aiDist+=SPEED*1.35*dt;
    var tot=totalDist(S.ai.tr);
    if(S.mode==='predict'&&nextPredict()) {/* paused inside */}
    if(S.aiDist>=tot){S.aiDist=tot;S.aiPlay=false;$('#btnPlay').innerHTML=ico('play')+' AI';aiVerdict();}
  }
  draw();
  requestAnimationFrame(loop);
}

/* ---------------- AI playback / predict ---------------- */
function aiVerdict(){
  if(!S.ai) return;
  var sc=S.ai.sc,v=$('#verdict');
  v.style.color=sc.ok?'var(--ghost)':'var(--bad)';
  v.innerHTML=S.pol.toUpperCase()+'<small>'+(sc.contact||S.ai.tr.contact?('hit '+S.ai.tr.contact):
    ((sc.gap*100).toFixed(0)+' cm · '+sc.ang.toFixed(1)+'° · '+sc.moves+' moves · '+sc.dist.toFixed(1)+' m'))+
    '<br>min clearance '+(sc.minClr*100).toFixed(0)+' cm</small>';
  v.style.opacity=1;
  setTimeout(function(){v.style.opacity=0;},4200);
}
function nextPredict(){
  var ev=S.ai.tr.events;
  for(var i=S.predictAt+1;i<ev.length;i++){
    if(ev[i].type!=='turn') continue;
    if(S.aiDist>=ev[i].s){ S.predictAt=i; S.aiPlay=false; askPredict(ev[i]); return true; }
    break;
  }
  return false;
}
function askPredict(ev){
  var opts=[['-1','LOCK TOWARD KERB'],['0','STRAIGHTEN'],['1','LOCK AWAY']];
  var html='<h3>PREDICT — WHAT DOES THE WHEEL DO NEXT?</h3>'+
    '<p style="color:var(--dim);font-size:12.5px;margin:0 0 4px">Angle '+D(sampleAt(S.ai.tr.samples,S.aiDist)[2]).toFixed(0)+
    '° · gap '+(flankGap.apply(null,sampleAt(S.ai.tr.samples,S.aiDist).slice(0,3))*100).toFixed(0)+' cm · '+
    'reserve '+((sampleAt(S.ai.tr.samples,S.aiDist)[1]-targetY()-CAR.R*(1-Math.cos(Math.abs(sampleAt(S.ai.tr.samples,S.aiDist)[2]))))*100).toFixed(0)+' cm</p>'+
    '<div id="predict">'+opts.map(function(o){return '<button class="btn" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  openModal(html);
  $('#predict').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    var right=Number(b.dataset.v)===ev.v;
    S.predictScore[1]++; if(right) S.predictScore[0]++;
    $('#mbox').innerHTML='<h3 style="color:'+(right?'var(--acc)':'var(--bad)')+'">'+
      (right?'CORRECT':'WRONG')+' — '+ev.text.toUpperCase()+'</h3>'+
      '<p style="color:#c3ccd8;font-size:13px">'+predictWhy(ev)+'</p>'+
      '<p style="color:var(--dim);font-size:12px">running '+S.predictScore[0]+'/'+S.predictScore[1]+'</p>'+
      '<button class="btn p" id="pgo">CONTINUE</button>';
    $('#pgo').onclick=function(){closeModal();S.aiPlay=true;$('#btnPlay').innerHTML=ico('pause')+' AI';};
  });
}
function predictWhy(ev){
  if(ev.v<0) return 'Lock toward the kerb rotates the body without translating it. This is where angle is bought — and the only thing that limits it is the car behind and your own rear overhang swinging out.';
  if(ev.v>0) return 'Lock away from the kerb unwinds. It returns exactly R(1−cos θ) of lateral. If your RESERVE was not zero when you flipped, you land short or you land on the kerb.';
  return 'Wheel straight: pure translation along the body axis. One metre reversed buys sin θ of lateral — more per metre than any arc.';
}

/* ---------------- tooltips ----------------
   A hint you have to ask for is a hint; a hint that ambushes you is noise. So:
   600 ms of deliberate hover to open the first one, then a 1.5 s warm window in
   which the rest open in 90 ms — the way a person who is *reading the panel*
   behaves, and not the way a person crossing it with the mouse behaves. Any key,
   any click, any scroll kills it instantly. Touch never sees it at all. */
var TIP={el:null,cur:null,k:null,pk:null,warm:-1e9,mute:false};
(function(){
  var box=document.createElement('div'); box.id='tip'; document.body.appendChild(box); TIP.el=box;
  var openT=0, closeT=0;
  var coarse=!(window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches);
  function body(el){ return el.getAttribute('data-tip') || (el.dataset.k?HTIP[el.dataset.k]:null); }
  function place(el){
    var r=el.getBoundingClientRect(), b=box.getBoundingClientRect();
    var x=r.left+r.width/2-b.width/2, y=r.top-b.height-9;
    if(y<6){ y=r.bottom+9; }
    x=clamp(x,6,window.innerWidth-b.width-6);
    y=clamp(y,6,window.innerHeight-b.height-6);
    box.style.left=Math.round(x)+'px'; box.style.top=Math.round(y)+'px';
  }
  function open(el){
    var t=body(el); if(!t) return;
    TIP.cur=el; TIP.k=el.dataset.k||null; TIP.pk=null;
    box.innerHTML=t; box.classList.add('on'); place(el);
  }
  function close(){
    if(!TIP.cur) return;
    TIP.cur=null; TIP.k=null; TIP.warm=performance.now();
    box.classList.remove('on');
  }
  function hard(){ clearTimeout(openT); clearTimeout(closeT); TIP.pk=null; close(); }
  TIP.hard=hard;
  /* HUD rows are replaced every frame, so identity is useless here: a pending
     hover is tracked by KEY, or the re-armed timer would never reach its delay. */
  function idOf(el){ return el.dataset.k || el.getAttribute('data-tip'); }
  document.addEventListener('mouseover',function(e){
    if(coarse||TIP.mute) return;
    var el=e.target.closest&&e.target.closest('[data-tip],[data-k]');
    if(!el||!body(el)){
      if(TIP.cur||TIP.pk){ clearTimeout(openT); TIP.pk=null; closeT=setTimeout(close,90); }
      return;
    }
    var id=idOf(el);
    if(TIP.cur&&idOf(TIP.cur)===id){ clearTimeout(closeT); TIP.cur=el; return; }
    if(TIP.pk===id) return;                       // already counting down for this one
    clearTimeout(openT); clearTimeout(closeT); TIP.pk=id;
    var warmish=performance.now()-TIP.warm<1500 || box.classList.contains('on');
    openT=setTimeout(function(){
      var live=el.isConnected?el:document.querySelector(
        el.dataset.k?'#hud [data-k="'+el.dataset.k+'"]':null);
      if(live) open(live);
    }, warmish?90:600);
  },true);
  document.addEventListener('mouseout',function(e){
    if(!TIP.cur&&!TIP.pk) return;
    var to=e.relatedTarget;
    if(to&&to.closest&&to.closest('[data-tip],[data-k]')) return;
    if(!to&&e.target.isConnected===false) return;   // node swapped under a still mouse
    clearTimeout(openT); clearTimeout(closeT);
    closeT=setTimeout(function(){TIP.pk=null;close();},120);
  },true);
  ['mousedown','wheel','scroll','touchstart'].forEach(function(ev){
    window.addEventListener(ev,hard,{capture:true,passive:true});
  });
  window.addEventListener('keydown',function(){ TIP.mute=true; hard(); },true);
  window.addEventListener('mousemove',function(e){
    if(TIP.mute&&(Math.abs(e.movementX)>2||Math.abs(e.movementY)>2)) TIP.mute=false;
  },true);
  window.addEventListener('blur',hard);
})();
/* HUD rows are rebuilt every frame; re-anchor the open tooltip to the fresh node
   and refresh its numbers in place, so the maths ticks while you read it. */
function tipTick(){
  if(!TIP.k||!TIP.el.classList.contains('on')) return;
  var el=hudEl.querySelector('[data-k="'+TIP.k+'"]');
  if(!el){ TIP.hard(); return; }
  TIP.cur=el;
  var t=HTIP[TIP.k]; if(t&&t!==TIP.el.innerHTML) TIP.el.innerHTML=t;
}

/* ---------------- timeline ---------------- */
function scrub(n){
  S.head=clamp(S.head+n,0,S.hist.length-1);
  var s=S.hist[S.head];
  S.pose=[s[0],s[1],s[2]];S.delta=s[3];S.dist=s[5];S.done=false;
  $('#verdict').style.opacity=0;
}
function rewindFlip(){
  var i=S.head, g=S.hist[i][4];
  while(i>0&&S.hist[i][4]===g) i--;
  while(i>0&&S.hist[i][4]===S.hist[i-1][4]) i--;
  S.head=i; scrub(0);
}
(function(){
  var bar=$('#tlbar'),drag=false;
  function at(e){
    var r=bar.getBoundingClientRect(), u=clamp((e.clientX-r.left)/r.width,0,1);
    var tot=Math.max(S.hist[S.hist.length-1][5],0.001);
    var d=u*tot, i=0;
    while(i<S.hist.length-1&&S.hist[i+1][5]<d) i++;
    S.head=i;scrub(0);
  }
  bar.addEventListener('pointerdown',function(e){drag=true;bar.setPointerCapture(e.pointerId);at(e);});
  bar.addEventListener('pointermove',function(e){if(drag)at(e);});
  bar.addEventListener('pointerup',function(){drag=false;});
})();
